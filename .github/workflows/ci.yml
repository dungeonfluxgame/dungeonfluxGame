# Continuous integration for the repository gates: formatting, native and wasm32 checks, clippy, the
# df-launcher build and tests, and unit tests of crates that need no database, provider or network.
# The toolchain comes from rust-toolchain.toml (rustup 1.28 reads it with `rustup toolchain install`).
# No secrets are used, no provider is called, and nothing is deployed.
# Caches are written only from main, so pull request runs restore main's cache and never overwrite it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "5"
  RUST_BACKTRACE: "1"

jobs:
  # rustfmt for the workspace and for the standalone df-launcher manifest (rustfmt.toml applies to both).
  # The workspace check is red until the coding-style sweep has formatted every file; that is expected.
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - name: Check formatting of the workspace
        shell: bash
        run: cargo fmt --all -- --check
      - name: Check formatting of df-launcher
        shell: bash
        run: cargo fmt --manifest-path crates/df-launcher/Cargo.toml -- --check

  # cargo check of every workspace member, native, including test and bench targets.
  # Windows: df-tools and df-launcher embed the Windows icon through rc.exe in build.rs,
  # and df-launcher is a Windows desktop program (WebView2, Win32), so the native check runs there.
  check:
    name: cargo check (workspace, native)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - name: Restore and save cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check --workspace
        shell: bash
        run: cargo check --workspace --all-targets --locked

  # clippy with warnings denied. Continue-on-error until the tree is clippy-clean; then remove the flag.
  clippy-native:
    name: clippy (workspace, native)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - name: Restore and save cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy --workspace
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # cargo check of df-tools for the browser target. The check needs no Windows tooling
  # (build.rs skips the resource step off windows-msvc), so it runs on Linux.
  wasm:
    name: cargo check (df-tools, wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain from rust-toolchain.toml and wasm32 target
        shell: bash
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Restore and save cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check -p df-tools --target wasm32-unknown-unknown
        shell: bash
        run: cargo check -p df-tools --target wasm32-unknown-unknown --locked

  clippy-wasm:
    name: clippy (df-tools, wasm32)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain from rust-toolchain.toml and wasm32 target
        shell: bash
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Restore and save cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy -p df-tools --target wasm32-unknown-unknown
        shell: bash
        run: cargo clippy -p df-tools --target wasm32-unknown-unknown --locked -- -D warnings

  # df-launcher is not a workspace member (its own Cargo.lock), so it is built and tested through its manifest.
  launcher:
    name: df-launcher (build and tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - name: Restore and save cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/df-launcher -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build df-launcher
        shell: bash
        run: cargo build --manifest-path crates/df-launcher/Cargo.toml --locked
      - name: Test df-launcher
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: cargo test --manifest-path crates/df-launcher/Cargo.toml --locked

  # Unit and integration tests of the crates that need no database, provider, network or live model call.
  # df-combat runs its --lib tests only: tests/rules_invariants.rs takes about ten minutes and has a failing case.
  unit:
    name: unit tests (crates without database or providers)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - name: Restore and save cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Unit tests of pure crates
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          RUST_MIN_STACK: "33554432"
        run: |
          cargo test --locked --lib --tests \
            -p df-types \
            -p df-protocol \
            -p df-locale \
            -p df-observe \
            -p df-rules \
            -p df-tempo \
            -p df-knowledge \
            -p df-intent \
            -p df-interaction \
            -p df-encounter \
            -p df-experience \
            -p df-content \
            -p df-model \
            -p df-media \
            -p df-presentation \
            -p df-world \
            -p df-ui \
            -p df-audio \
            -p df-assets \
            -p df-narrative
          cargo test --locked --lib -p df-combat

  # Skips. Owners are the COORDINATION.md areas that most likely own each module; the coordinator confirms them.
  # libtest applies --exact to every --skip at once, and the adventure suite is 185 tests, so the skips are
  # full test paths matched as substrings. Each path matches exactly one test (checked against --list).
  # A test leaves this list when its owner fixes it, and the job then runs it again.
  #   gameplay::adventure:: (N): the slow suite, 692 s in the baseline; 2 baseline failures inside.
  #   n1_spoken_departure (N): stack overflow in the baseline; the overflow aborts the whole module.
  #   owner N: 16 failing tests on the current tree
  #   owner W1: 36 failing tests on the current tree
  #   owner W2: 11 failing tests on the current tree
  #   owner W4: 1 failing tests on the current tree
  #   owner W8: 1 failing tests on the current tree
  tools:
    name: df-tools unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - name: Restore and save cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: df-tools lib tests
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          RUST_MIN_STACK: "33554432"
        run: |
          cargo test --locked --lib -p df-tools -- \
            --skip gameplay::adventure:: \
            --skip gameplay::dialogue::navigation_tests::n1_spoken_departure_commits_the_exit_move_and_shows_arrival \
            --skip gameplay::beat_script_tests::real_pre_change_checkpoint_bytes_resume_with_exact_pins_and_reencode_unchanged \
            --skip gameplay::beat_script_tests::stored_game_without_hit_point_dice_loads_with_one_unspent_d10_for_short_rest_srd_p47 \
            --skip gameplay::dialogue::examine_tests::hs59_scene_examine_compound_approach_commits_the_spot_and_requests_its_plate \
            --skip gameplay::dialogue::navigation_tests::story_input_one_four_and_six_mixed_heroes_reach_the_storyteller_after_opening \
            --skip gameplay::dialogue::opening_social_resume_tests::opening_social_authenticated_helper_reaches_actor_and_advantage_is_consumed_once \
            --skip gameplay::dialogue::opening_social_resume_tests::opening_social_invitation_reaches_influence_before_travel_and_departure_stays_blocked \
            --skip gameplay::dialogue::examine_tests::hs71_item_decision_replays_once_and_only_a_successful_bound_roll_publishes_its_hidden_detail \
            --skip gameplay::npc_dossier_tests::a_crude_reply_is_kept_when_mature_and_replaced_by_the_prepared_answer_when_restrained \
            --skip gameplay::npc_dossier_tests::a_local_question_backfills_before_speech_and_the_same_question_gets_it_from_canon \
            --skip gameplay::npc_dossier_tests::a_reply_that_reveals_a_secret_is_refused_and_the_prepared_answer_is_given_instead \
            --skip gameplay::npc_dossier_tests::a_reply_that_reveals_a_secret_is_refused_the_same_way_when_restrained \
            --skip gameplay::npc_dossier_tests::an_instruction_in_the_players_line_is_refused_the_same_way_when_restrained \
            --skip gameplay::npc_dossier_tests::an_instruction_in_the_players_line_never_changes_the_prompt_and_obeying_it_is_refused \
            --skip gameplay::npc_dossier_tests::authored_silence_is_terminal_and_clears_thinking_without_caption_or_speech \
            --skip gameplay::npc_dossier_tests::recorded_errand_talk_answers_subjects_and_reacts_to_threat_srd_5_2_1_page_184 \
            --skip gameplay::npc_dossier_tests::with_the_text_model_off_every_line_still_gets_the_dossiers_answer_by_topic_and_attitude \
            --skip gameplay::journey::fight_ending_tests::every_listed_player_offer_is_accepted_when_taken_across_the_played_path \
            --skip gameplay::journey::scene_fight::tests::created_place_people_have_canonical_assault_offers_rosters_and_srd_resource_bounds \
            --skip gameplay::journey::scene_fight::tests::legacy_created_people_stage_commoner_combat_with_deterministic_snapshots \
            --skip gameplay::journey::tactical::tests::a_won_fight_with_a_dying_hero_resolves_on_the_table_without_a_dead_end \
            --skip gameplay::journey::tactical::tests::canonical_harbor_default_three_bandits_last_three_to_five_rounds_and_all_action_labels_are_safe \
            --skip gameplay::journey::tactical::tests::canonical_live_default_seed_sample_records_source_enemy_attacks_and_typical_three_to_five_rounds \
            --skip gameplay::journey::tactical::tests::current_tactical_profile_preserves_e01_fixture_scenes_and_noncanonical_fight_replay \
            --skip gameplay::journey::tactical::tests::fighter_level_five_four_skeletons_offers_surge_and_recovers_pending_action_to_victory \
            --skip gameplay::journey::tactical::tests::mixed_build_live_actions_replay_bytes_and_midfight_checkpoint_resume_to_victory_rest \
            --skip gameplay::journey::tactical::tests::move_options_warn_when_the_path_provokes_opportunity_attacks \
            --skip gameplay::journey::tactical::tests::r2_level_five_pair_completes_ogre_and_troll_fights_with_source_stats \
            --skip gameplay::journey::tactical::tests::six_heroes_and_four_enemies_have_distinct_spawns_ids_and_resolve_a_full_round \
            --skip gameplay::journey::tactical::tests::submitted_archer_shot_uses_cover_consumes_ammunition_and_empty_quiver_removes_longbow_offer \
            --skip gameplay::journey::tactical::tests::submitted_disengage_prevents_source_opportunity_window_and_enemy_policy_attacks \
            --skip gameplay::journey::tactical::tests::submitted_enemy_lethality_reaches_defeat_and_timed_dying_saves_without_universal_rest_revival \
            --skip gameplay::journey::tactical::tests::submitted_help_attack_gives_the_ally_advantage_and_refuses_pairs_the_rules_do_not_allow \
            --skip gameplay::journey::tactical::tests::submitted_melee_attack_records_knockout_choice_and_brawl_default \
            --skip gameplay::journey::tactical::tests::submitted_optional_hero_reaction_during_enemy_turn_survives_checkpoint_and_declines_without_spending \
            --skip gameplay::journey::tactical::tests::tactical_terminal_provenance_refuses_forged_cause_outcome_resource_source_and_unaccepted_event \
            --skip gameplay::journey::tactical::tests::three_scouts_opening_on_the_salt_quay_start_their_fight \
            --skip gameplay::journey::tests::one_to_six_heroes_finish_the_courier_fight_and_receive_the_inn_invitation \
