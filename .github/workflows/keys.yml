# Build, push and SIGN the SSH key set (round 2b). STATUS: UNVERIFIED, never run.
#
# A key set grants root-equivalent access (it decides who may SSH to every host), so it is signed by its OWN workflow identity, different
# from the release one, and the job runs in a GitHub environment named `keys` whose REQUIRED REVIEWERS are the owner:
#   https://github.com/OWNER/REPO/.github/workflows/keys.yml@refs/heads/main        (Terraform: cosign_keys_certificate_identity)
# The hosts refuse a key set signed by the release workflow and a release signed by this one.
#
# THE ENVIRONMENT IS NOT CREATED HERE. The owner creates `keys` in the repository settings (Settings > Environments), adds themselves as
# a required reviewer, and restricts it to the main branch. Until that exists the job waits for an environment that has no protection, so
# do not run this workflow before the owner has set it up.
name: keys

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keys
  cancel-in-progress: false

jobs:
  keys:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: keys
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    steps:
      - name: Verify keys environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! environment=$(gh api "repos/${GITHUB_REPOSITORY}/environments/keys" 2>/dev/null); then
            echo "Missing or unreadable GitHub environment: keys"
            exit 1
          fi
          missing=0
          if ! jq -e 'any(.protection_rules[]?; .type == "required_reviewers" and ((.reviewers // []) | length > 0))' <<<"$environment" >/dev/null; then
            echo "Missing required reviewer protection rule: keys"
            missing=1
          fi
          if jq -e '.deployment_branch_policy.protected_branches == true' <<<"$environment" >/dev/null; then
            :
          elif jq -e '.deployment_branch_policy.custom_branch_policies == true' <<<"$environment" >/dev/null; then
            if ! branch_policies=$(gh api "repos/${GITHUB_REPOSITORY}/environments/keys/deployment-branch-policies" 2>/dev/null); then
              echo "Missing main-only deployment restriction: keys"
              missing=1
            elif ! jq -e '.branch_policies | length == 1 and .[0].name == "main"' <<<"$branch_policies" >/dev/null; then
              echo "Missing main-only deployment restriction: keys"
              missing=1
            fi
          else
            echo "Missing deployment restriction to protected branches or main: keys"
            missing=1
          fi
          exit "$missing"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Validate, build, push and sign the key set (infra/keys/)
        env:
          DF_REGISTRY_PREFIX: ghcr.io/${{ github.repository_owner }}
        run: deploy/scripts/build-release.sh keys --push --sign | tee "$RUNNER_TEMP/keys.txt"
      - name: Show the digest
        run: |
          grep "^KEYS_DIGEST=" "$RUNNER_TEMP/keys.txt"
          grep "^KEYS_DIGEST=" "$RUNNER_TEMP/keys.txt" >> "$GITHUB_STEP_SUMMARY"
