[workspace]
members = ["crates/df-types", "crates/df-protocol", "crates/df-rpc-bridge", "crates/df-observe", "crates/df-tools", "crates/df-telemetry", "crates/df-locale", "crates/df-auth", "crates/df-client", "crates/df-knowledge", "crates/df-interaction", "crates/df-ai", "crates/df-media", "crates/df-content", "crates/df-encounter", "crates/df-experience", "crates/df-intent", "crates/df-testkit", "crates/df-model", "crates/df-assets", "crates/df-session", "crates/df-world", "crates/df-ui", "crates/df-rules", "crates/df-player", "crates/df-display", "crates/df-web", "crates/df-combat", "crates/df-engine", "crates/df-narrative", "crates/df-persistence", "crates/df-api", "crates/df-tempo", "crates/df-presentation", "crates/df-audio", "crates/df-render", "crates/df-commerce", "crates/df-provider-api", "crates/df-providers", "crates/df-imagery", "crates/df-customer", "crates/df-portal", "crates/df-account-app", "crates/df-workos", "crates/df-google", "crates/df-finance", "crates/df-runner", "crates/df-server", "crates/df-campaign", "crates/df-campaign-wire", "crates/df-acceptance", "crates/df-support", "crates/df-hosted"]
resolver = "3"
exclude = ["crates/df-rpc-bridge/vendor/h2"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
bytes = "1.11"
futures = "0.3"
h2 = "0.4.19"
http = "1.4"
http-body = "1.0"
http-body-util = "0.1"
prost = "0.14"
tokio = { version = "1.50", default-features = false, features = ["io-util", "sync"] }
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.6"
tower-service = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[patch.crates-io]
h2 = { path = "crates/df-rpc-bridge/vendor/h2" }

# Debug builds hash and decode multi-megabyte images on every image poll; unoptimized SHA-256 and
# codecs run at about 1 MB/s there and starve the async workers. df-imagery instantiates the
# generic `image` resize code itself, so a 2560x1440 Lanczos resize needs its own optimization.
# Release builds are unaffected.
[profile.dev.package.df-imagery]
opt-level = 2
[profile.dev.package."sha2@0.10.9"]
opt-level = 3
[profile.dev.package."sha2@0.11.0"]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package."miniz_oxide@0.8.9"]
opt-level = 3
[profile.dev.package."miniz_oxide@0.9.1"]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
