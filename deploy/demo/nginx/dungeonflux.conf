map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server_tokens off;
client_max_body_size 10m;
access_log /var/log/nginx/dungeonflux.access.log;
error_log /var/log/nginx/dungeonflux.error.log warn;

server {
    listen 80;
    listen [::]:80;
    server_name dungeonfluxdnd.com;

    root /opt/dungeonflux/site;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    include /etc/nginx/snippets/dungeonflux-hsts.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /tv {
        rewrite ^ /gameplay/display last;
    }

    location = /play {
        rewrite ^ /gameplay/player last;
    }

    location ~ ^/(sessions|api/v1|s|embed)(/|$) {
        return 404;
    }

    location = /oembed {
        return 404;
    }

    location ^~ /app/ {
        alias /opt/dungeonflux/app/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    location = /app {
        return 301 /app/;
    }

    location ^~ /gameplay {
        proxy_pass http://127.0.0.1:__GAME_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /pkg/ {
        proxy_pass http://127.0.0.1:__GAME_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /assets/splat/ {
        proxy_pass http://127.0.0.1:__GAME_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name 157.230.52.8;
    root /opt/dungeonflux/site;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
