map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server_tokens off;
client_max_body_size 10m;
access_log /var/log/nginx/dungeonflux.access.log;
error_log /var/log/nginx/dungeonflux.error.log warn;

server {
    listen 80;
    listen [::]:80;
    server_name dungeonfluxdnd.com;

    root /opt/dungeonflux/site;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    include /etc/nginx/snippets/dungeonflux-hsts.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /tv {
        rewrite ^ /gameplay/display last;
    }

    location = /play {
        rewrite ^ /gameplay/player last;
    }

    # HOSTEDSTACK's loopback portal mounts df_campaign::session_link::router at the root.
    location ^~ /sessions/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 504 =503 @session_waiting;
    }

    location @session_waiting {
        default_type text/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header Retry-After 3 always;
        return 503 '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DungeonFlux - getting ready</title><main><h1>The table is getting ready</h1><p>The game connection is not ready yet.</p><p><a href="">Retry</a></p></main></html>';
    }

    location ~ ^/(sessions|api/v1|s|embed)(/|$) {
        return 404;
    }

    location = /oembed {
        return 404;
    }

    location ^~ /app/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    location = /app {
        return 301 /app/;
    }

    location ^~ /gameplay {
        proxy_pass http://127.0.0.1:__GAME_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /pkg/ {
        proxy_pass http://127.0.0.1:__GAME_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /assets/splat/ {
        proxy_pass http://127.0.0.1:__GAME_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name 157.230.52.8;
    root /opt/dungeonflux/site;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /app/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    location = /app {
        return 301 /app/;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.dungeonfluxdnd.com;
    return 301 https://dungeonfluxdnd.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name play.dungeonfluxdnd.com;
    return 301 https://dungeonfluxdnd.com/play;
}

server {
    listen 80;
    listen [::]:80;
    server_name tv.dungeonfluxdnd.com;
    return 301 https://dungeonfluxdnd.com/tv;
}
