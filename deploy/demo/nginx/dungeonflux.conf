map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server_tokens off;
client_max_body_size 10m;
# access_log defaults to combined when no format is named; keep this format query- and header-free.
# https://nginx.org/en/docs/http/ngx_http_log_module.html#access_log
log_format dungeonflux_safe '$request_method $uri status=$status bytes=$body_bytes_sent '
                            'request_time=$request_time upstream_status=$upstream_status '
                            'request_id=$request_id';
access_log /var/log/nginx/dungeonflux.access.log dungeonflux_safe;
error_log /var/log/nginx/dungeonflux.error.log warn;

server {
    listen 80;
    listen [::]:80;
    server_name dungeonfluxdnd.com;
    access_log /var/log/nginx/dungeonflux.access.log dungeonflux_safe;

    root /opt/dungeonflux/site;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    include /etc/nginx/snippets/dungeonflux-hsts.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /tv {
        rewrite ^ /gameplay/display last;
    }

    location = /play {
        rewrite ^ /gameplay/player last;
    }

    # HOSTEDSTACK's loopback portal mounts df_campaign::session_link::router at the root.
    location ^~ /sessions/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 504 =503 @session_waiting;
    }

    location @session_waiting {
        default_type text/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header Retry-After 3 always;
        return 503 '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DungeonFlux - getting ready</title><main><h1>The table is getting ready</h1><p>The game connection is not ready yet.</p><p><a href="">Retry</a></p></main></html>';
    }

    location ~ ^/(sessions|api/v1|s|embed)(/|$) {
        return 404;
    }

    location = /oembed {
        return 404;
    }

    location ^~ /app/api/ {
        # OAuth and payment returns carry secrets in query strings; suppress non-critical upstream diagnostics.
        # NGINX error logs include request details at error level; crit excludes those entries.
        # https://nginx.org/en/docs/ngx_core_module.html#error_log
        error_log /var/log/nginx/dungeonflux.error.log crit;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        include /etc/nginx/snippets/dungeonflux-hsts.conf;
        proxy_hide_header Referrer-Policy;
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @accounts_closed;
    }

    location ^~ /app/ {
        # NGINX replaces inherited add_header directives at this level, so repeat the site's protections.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        include /etc/nginx/snippets/dungeonflux-hsts.conf;
        proxy_hide_header Referrer-Policy;
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @accounts_closed;
    }

    location @accounts_closed {
        root /opt/dungeonflux/site;
        include /etc/nginx/snippets/dungeonflux-hsts.conf;
        try_files $uri $uri/ $uri/index.html /app/index.html;
    }

    location = /app {
        return 301 /app/;
    }

    location ^~ /gameplay {
        proxy_pass http://127.0.0.1:__GAME_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /pkg/ {
        proxy_pass http://127.0.0.1:__GAME_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /assets/splat/ {
        proxy_pass http://127.0.0.1:__GAME_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}

