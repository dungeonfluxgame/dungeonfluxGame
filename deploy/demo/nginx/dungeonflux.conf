}

server {
    listen 80;
    listen [::]:80;
    server_name www.dungeonfluxdnd.com;
    return 301 https://dungeonfluxdnd.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name play.dungeonfluxdnd.com;
    return 301 https://dungeonfluxdnd.com/play;
}

server {
    listen 80;
    listen [::]:80;
    server_name tv.dungeonfluxdnd.com;
    return 301 https://dungeonfluxdnd.com/tv;
}
