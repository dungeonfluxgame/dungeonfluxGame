# db-gate (PRODUCTION and staging environment): a plain TCP forwarder, the ONLY path from any service to the managed PostgreSQL cluster
# (decision 23). TLS is end to end between each client and PostgreSQL (verify-full against the cluster certificate's name), so the gate
# cannot read or alter traffic. It exists so that the runtime, runner and dispatcher networks have no route to the database host or
# the VPC. Template: `df-deploy release` fills @DB_HOST@ (the cluster's private NAME) and @DB_PORT@ (25060).
#
# The gate RESOLVES that name itself, through Docker's embedded resolver (haproxy `resolvers`, init-addr none): it starts even before the
# name resolves and follows a change of the cluster's address after a failover. The firewall lets the database bridge send DNS to the
# host's upstream resolvers and tcp 25060-25061 into the VPC and nothing else (infra/cloud-init/df-net-rules.sh), so no firewall change and
# no new release is needed when the address changes. UNVERIFIED (haproxy syntax checked by reading only; never run).
#
# Each network gets its own bind address, so a client reaches the gate only on its own network.
global
    maxconn 256
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 10m
    timeout server 10m

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold nx 5s
    hold timeout 10s

frontend data
    bind 172.30.2.7:5432
    default_backend postgres

frontend dispatch
    bind 172.30.4.2:5432
    default_backend postgres

frontend runner
    bind 172.30.6.2:5432
    default_backend postgres

frontend slot1
    bind 172.30.11.2:5432
    default_backend postgres

frontend slot2
    bind 172.30.12.2:5432
    default_backend postgres

backend postgres
    server pg @DB_HOST@:@DB_PORT@ check resolvers docker init-addr none resolve-prefer ipv4 inter 5s
