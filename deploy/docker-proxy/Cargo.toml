[package]
name = "df-docker-proxy"
description = "Body-checking Docker API proxy for the trusted runner: it forwards only the few container calls the runner needs, and only for campaign runtimes that match the policy."
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

# Not a member of the repository workspace (its own Cargo.lock), like df-launcher: it is a deployment tool that is built
# by deploy/images/Dockerfile (target docker-proxy), not part of the game.
[workspace]

[[bin]]
name = "df-docker-proxy"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", default-features = false }
serde_json = "=1.0.151"
