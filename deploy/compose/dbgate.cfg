# db-gate: a plain TCP forwarder, the ONLY path from a campaign runtime to PostgreSQL (decision 23). It adds
# nothing at the protocol level: TLS is end to end between the runtime and PostgreSQL (verify-full, with the
# configured server name), so the gate cannot read or alter traffic. It exists so that the runtime networks
# have no route to the database host or the VPC; in production the same container forwards to the managed
# cluster's private endpoint. UNVERIFIED (haproxy syntax checked by reading only).
#
# Each slot network gets its own bind address so a runtime reaches the gate only on its own network.
global
    maxconn 256
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 10m
    timeout server 10m

frontend slot1
    bind 172.30.11.2:5432
    default_backend postgres

frontend slot2
    bind 172.30.12.2:5432
    default_backend postgres

# The egress dispatcher reaches the database the same way (it is not on the data network).
frontend dispatch
    bind 172.30.4.2:5432
    default_backend postgres

backend postgres
    # Staging: the container on the data network. Production: the managed cluster's private host and port.
    server pg 172.30.2.2:5432 check
