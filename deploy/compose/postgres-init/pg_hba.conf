# Staging PostgreSQL host-based authentication. Order matters: the first matching line wins.
#  1. local socket: for the superuser inside the container only (health checks, init scripts, operator tools).
#  2. the cluster administrator can NEVER log in over the network, from any container.
#  3. application roles: TLS only, scram only, only to the application database, and PINNED TO THE SOURCE ADDRESS of the
#     one service that legitimately uses the role, as far as the staging topology allows:
#        df_control, df_accounts, df_campaigns   only from the control plane's data-network address
#        df_migrator                 only from the data network's dynamic range (the one-shot migrate job)
#        df_campaign_runtime, df_egress  only from the db-gate (every runtime and the dispatcher arrive from its address;
#                                    the gate cannot tell the two tiers apart, so these two share a source)
#     df_runner, df_finance and df_support have no staging service, so they match nothing and fall to the reject.
#     RESIDUAL (coordinator ruling f): managed PostgreSQL has NO pg_hba control, and its trusted source is the whole Droplet,
#     so in production role separation rests on the secrecy of each role's password (one secrets directory per service,
#     one group per consumer) and on the database's own grants, not on a source-address pin. Staging demonstrates the
#     pin where it can; production cannot have it.
#  4. everything else is rejected, including non-TLS connections by an application role.
local     all           all                                          trust
hostssl   all           df_admin           0.0.0.0/0                 reject
hostssl   all           df_admin           ::/0                      reject
hostssl   dungeonflux   df_control,df_accounts,df_campaigns   172.30.2.4/32   scram-sha-256
hostssl   dungeonflux   df_migrator        172.30.2.128/25           scram-sha-256
hostssl   dungeonflux   df_campaign_runtime,df_egress   172.30.2.7/32   scram-sha-256
host      all           all                0.0.0.0/0                 reject
host      all           all                ::/0                      reject
