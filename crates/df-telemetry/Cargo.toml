[package]
name = "df-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
df-observe = { path = "../df-observe" }
df-types = { path = "../df-types" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
prost.workspace = true
opentelemetry = { version = "=0.31.0", default-features = false, features = ["trace", "logs"] }
opentelemetry-proto = { version = "=0.31.0", default-features = false, features = ["logs", "trace", "gen-tonic-messages"] }

[[bin]]
name = "df-telemetry"
path = "src/main.rs"
