[package]
name = "df-table-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "df_table_host"
path = "src/lib.rs"

[[bin]]
name = "df-table"
path = "src/main.rs"

[dependencies]
df-table = { path = "../df-table" }
df-playground = { path = "../df-playground" }
axum = "=0.8.9"
base64 = "=0.22.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "net", "time", "io-util", "sync", "signal", "macros"] }

[dev-dependencies]
df-table = { path = "../df-table", features = ["testkit"] }
tempfile = "=3.27.0"
