[package]
name = "df-account-app"
description = "The DungeonFlux account web app: sign up, sign in, the customer dashboard and the operator console, compiled to wasm32 and served at /app/."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "Document",
    "Element",
    "Event",
    "FocusOptions",
    "EventTarget",
    "Headers",
    "History",
    "HtmlElement",
    "Location",
    "MouseEvent",
    "Navigator",
    "Node",
    "NodeList",
    "Request",
    "RequestCache",
    "RequestCredentials",
    "RequestInit",
    "Response",
    "Text",
    "Url",
    "Window",
    "console",
] }

