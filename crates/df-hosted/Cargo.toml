[package]
name = "df-hosted"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "df-portal-hosted"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
df-account-app = { path = "../df-account-app" }
df-customer = { path = "../df-customer" }
df-google = { path = "../df-google" }
df-portal = { path = "../df-portal" }
df-persistence = { path = "../df-persistence" }
df-workos = { path = "../df-workos" }
df-finance = { path = "../df-finance" }
df-commerce = { path = "../df-commerce" }
df-campaign = { path = "../df-campaign" }
df-types = { path = "../df-types" }
df-observe = { path = "../df-observe" }
df-telemetry = { path = "../df-telemetry" }
opentelemetry = { version = "=0.31.0", default-features = false, features = ["trace"] }
df-support = { path = "../df-support" }
async-trait = "=0.1.92"
axum = { version = "=0.8.9", default-features = false, features = ["json", "form", "http1", "tokio"] }
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "form"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
tokio-postgres = "=0.7.15"
sha2 = "=0.11.0"
hmac = "=0.13.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
df-support = { path = "../df-support", features = ["fakes"] }
tower = { version = "=0.5.3", features = ["util"] }
http-body-util.workspace = true
futures.workspace = true
