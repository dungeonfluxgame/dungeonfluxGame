[package]
name = "df-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
public-scene-delivery-fixture = []
browser-callback-overflow-fixture = ["df-rpc-bridge/browser-callback-overflow-fixture"]

[[bin]]
name = "df-transport-fixture"
path = "src/main.rs"

[dependencies]
prost.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
df-assets = { path = "../df-assets" }
web-time = "=1.1.0"
df-protocol = { path = "../df-protocol" }
df-client = { path = "../df-client" }
df-types = { path = "../df-types" }
df-rpc-bridge = { path = "../df-rpc-bridge" }
df-rules = { path = "../df-rules" }
df-observe = { path = "../df-observe" }
bytes.workspace = true
sha2 = "=0.10.9"
futures.workspace = true
tonic.workspace = true
tokio.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "=0.2.17"
df-intent = { path = "../df-intent" }
axum = { version = "0.8", features = ["ws"] }
tonic = { workspace = true, features = ["transport", "router"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "signal", "process"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs"] }
df-api = { path = "../df-api" }
df-ai = { path = "../df-ai" }
df-auth = { path = "../df-auth" }
df-campaign = { path = "../df-campaign", features = ["routes"] }
df-combat = { path = "../df-combat" }
# The supplier tariff (price table and bill reader) the cost book shares with the money core.
df-commerce = { path = "../df-commerce" }
df-content = { path = "../df-content" }
df-encounter = { path = "../df-encounter" }
df-engine = { path = "../df-engine" }
df-interaction = { path = "../df-interaction" }
df-model = { path = "../df-model" }
df-knowledge = { path = "../df-knowledge" }
df-narrative = { path = "../df-narrative" }
df-world = { path = "../df-world" }
df-persistence = { path = "../df-persistence" }
df-provider-api = { path = "../df-provider-api" }
df-providers = { path = "../df-providers" }
df-session = { path = "../df-session" }
df-tempo = { path = "../df-tempo" }
df-render = { path = "../df-render" }
serde_path_to_error = "=0.1.20"
tokio-postgres = "=0.7.15"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
qrcode = { version = "=0.14.1", default-features = false }

[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
df-ui = { path = "../df-ui" }
df-render = { path = "../df-render" }
js-sys = "=0.3.106"
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { workspace = true, features = ["Window", "History", "Document", "Element", "HtmlElement", "HtmlButtonElement", "HtmlVideoElement", "Event", "Location", "Performance", "Navigator", "Request", "RequestInit", "Response", "Crypto", "HtmlSelectElement", "HtmlTextAreaElement", "AbortController", "AbortSignal", "RequestMode", "RequestCredentials", "RequestCache", "Headers", "ReadableStream", "ReadableStreamDefaultReader", "Node", "Storage", "HtmlAudioElement", "HtmlMediaElement", "DomTokenList", "KeyboardEvent", "Blob", "BlobPropertyBag", "Url", "console", "AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioDestinationNode", "AudioNode", "AudioScheduledSourceNode", "AudioParam", "GainNode", "BaseAudioContext", "CssStyleDeclaration", "DomRect"] }
# Web Audio interfaces for the music director. Declared apart from the list above so work on
# that list and on this one merge cleanly; Cargo unions the features of both entries.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-sys = { workspace = true, features = ["AudioContext", "AudioContextState", "AudioBuffer", "AudioBufferSourceNode", "AudioDestinationNode", "AudioNode", "AudioParam", "AudioScheduledSourceNode", "BaseAudioContext", "BiquadFilterNode", "BiquadFilterType", "GainNode"] }

# Tap-to-talk speech input: microphone capture, recording, decoding and the pointer geometry of
# the control. A table of its own (the extra `target_env` term names the same browser target) so
# that edits to the lists above never touch these lines.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown", target_env = ""))'.dependencies]
web-sys = { workspace = true, features = ["MediaDevices", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints", "MediaRecorder", "BlobEvent", "RecordingState", "OfflineAudioContext", "PointerEvent", "MouseEvent", "DomRect", "EventTarget"] }

[dev-dependencies]
df-types = { path = "../df-types" }
prost-types = "0.14"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
df-campaign = { path = "../df-campaign", features = ["test-fakes", "routes"] }
tokio-tungstenite = "0.29"
# The charge-site guard in gameplay/cost_tests.rs reads the sources as Rust, not as text.
syn = { version = "=2.0.119", features = ["full", "visit"] }

[[test]]
name = "public_scene_assets"
path = "tests/public_scene_assets.rs"

[[example]]
name = "public_scene_delivery_fixture"
path = "tests/fixtures/public_scene_delivery_fixture.rs"
crate-type = ["cdylib"]
required-features = ["public-scene-delivery-fixture"]
test = false
bench = false
