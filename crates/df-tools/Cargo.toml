[package]
name = "df-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
public-scene-delivery-fixture = []
browser-callback-overflow-fixture = ["df-rpc-bridge/browser-callback-overflow-fixture"]

[[bin]]
name = "df-transport-fixture"
path = "src/main.rs"

[dependencies]
df-assets = { path = "../df-assets" }
web-time = "=1.1.0"
df-protocol = { path = "../df-protocol" }
df-client = { path = "../df-client" }
df-types = { path = "../df-types" }
df-rpc-bridge = { path = "../df-rpc-bridge" }
df-observe = { path = "../df-observe" }
bytes.workspace = true
futures.workspace = true
tonic.workspace = true
tokio.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
df-intent = { path = "../df-intent" }
axum = { version = "0.8", features = ["ws"] }
tonic = { workspace = true, features = ["transport", "router"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs"] }
df-api = { path = "../df-api" }
df-ai = { path = "../df-ai" }
df-auth = { path = "../df-auth" }
df-combat = { path = "../df-combat" }
df-content = { path = "../df-content" }
df-encounter = { path = "../df-encounter" }
df-engine = { path = "../df-engine" }
df-interaction = { path = "../df-interaction" }
df-model = { path = "../df-model" }
df-knowledge = { path = "../df-knowledge" }
df-narrative = { path = "../df-narrative" }
df-world = { path = "../df-world" }
df-persistence = { path = "../df-persistence" }
df-rules = { path = "../df-rules" }
df-session = { path = "../df-session" }
df-tempo = { path = "../df-tempo" }
prost.workspace = true
sha2 = "=0.10.9"
tokio-postgres = "=0.7.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
df-ui = { path = "../df-ui" }
js-sys = "=0.3.106"
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "HtmlButtonElement", "Event", "Location", "Performance", "Navigator", "Request", "RequestInit", "Response", "Crypto", "HtmlSelectElement", "HtmlTextAreaElement", "AbortController", "AbortSignal", "RequestMode", "RequestCredentials", "RequestCache", "Headers", "ReadableStream", "ReadableStreamDefaultReader", "Node"] }

[dev-dependencies]
df-types = { path = "../df-types" }
prost.workspace = true
prost-types = "0.14"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio-tungstenite = "0.29"

[[test]]
name = "public_scene_assets"
path = "tests/public_scene_assets.rs"

[[example]]
name = "public_scene_delivery_fixture"
path = "tests/fixtures/public_scene_delivery_fixture.rs"
crate-type = ["cdylib"]
required-features = ["public-scene-delivery-fixture"]
test = false
bench = false
