[package]
name = "df-rpc-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
browser-callback-overflow-fixture = []

[dependencies]
web-time = "=1.1.0"
bytes.workspace = true
futures.workspace = true
h2.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
tokio.workspace = true
tonic.workspace = true
tower-service.workspace = true
df-observe = { path = "../df-observe" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { workspace = true, features = ["WebSocket", "BinaryType", "MessageEvent", "Event", "CloseEvent"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", features = ["ws"] }
tonic = { workspace = true, features = ["transport"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio-tungstenite = "0.29"
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
tonic = { workspace = true, features = ["transport", "router"] }

# The machine surface of the plan (W0 and W1): the generated contract and its hand-built samples
# drive the native round-trip test and the browser example.
[dev-dependencies]
df-api = { path = "../df-api" }
df-protocol = { path = "../df-protocol" }
prost.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
web-sys = { workspace = true, features = ["Window", "Document", "Element", "Location"] }

[[example]]
name = "machine_browser"
crate-type = ["cdylib"]
