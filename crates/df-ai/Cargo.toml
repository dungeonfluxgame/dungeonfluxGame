[package]
name = "df-ai"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
df-types = { path = "../df-types" }
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
df-model = { path = "../df-model" }
df-interaction = { path = "../df-interaction" }
df-provider-api = { path = "../df-provider-api" }

# The shared diagnostic types exist only on native targets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
df-observe = { path = "../df-observe" }
