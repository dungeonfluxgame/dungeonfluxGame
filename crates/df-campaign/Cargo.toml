[package]
name = "df-campaign"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[features]
# Faithful in-memory directories (accounts, sessions, funding) and a fixed clock, for the tests
# of this crate and its consumers. Never enabled in a production build.
test-fakes = []
# The JSON route module that B mounts under /app/api/.
routes = ["dep:axum", "dep:http", "dep:serde", "dep:reqwest", "dep:tokio-tungstenite", "dep:futures"]

# A server crate: nothing here builds for the browser, so the whole dependency set is native only
# (like df-customer), and the library is empty on wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
df-types = { path = "../df-types" }
df-auth = { path = "../df-auth" }
df-observe = { path = "../df-observe" }
df-campaign-wire = { path = "../df-campaign-wire" }
getrandom = "=0.3.4"
hmac = "=0.13.0"
sha2 = "=0.11.0"
serde = { version = "=1.0.229", optional = true }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "time", "sync", "macros"] }
axum = { version = "=0.8.9", default-features = false, features = ["json", "query", "http1", "tokio", "matched-path", "ws"], optional = true }
http = { version = "=1.5.0", optional = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"], optional = true }
tokio-tungstenite = { version = "=0.29.0", optional = true }
futures = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
df-campaign = { path = ".", features = ["test-fakes", "routes"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "rt-multi-thread", "time", "sync", "macros", "net", "test-util"] }
tokio-postgres = { version = "=0.7.15", default-features = true }
df-customer = { path = "../df-customer", features = ["test-fakes"] }
tower = { version = "=0.5.3", features = ["util"] }
