[package]
name = "df-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
df-render = { path = "../df-render" }
df-locale = { path = "../df-locale" }
df-client = { path = "../df-client" }
df-types = { path = "../df-types" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
wasm-bindgen.workspace = true
js-sys = "=0.3.106"
web-sys = { workspace = true, features = ["Window", "Document", "Element", "Node", "Event", "EventTarget", "HtmlElement", "HtmlButtonElement", "HtmlInputElement", "KeyboardEvent", "KeyboardEventInit", "Blob", "BlobPropertyBag", "Url", "HtmlImageElement", "MutationObserver", "MutationObserverInit", "CanvasRenderingContext2d", "HtmlCanvasElement", "ImageData"] }

