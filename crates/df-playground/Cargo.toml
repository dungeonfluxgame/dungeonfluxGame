[package]
name = "df-playground"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys = "=0.3.106"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { workspace = true, features = ["Window", "Location", "Document", "Element", "HtmlElement", "CssStyleDeclaration","HtmlSelectElement", "Node", "NodeList", "HtmlCollection", "HtmlAudioElement", "HtmlMediaElement", "HtmlImageElement", "Navigator", "UserActivation", "Event", "EventTarget", "Response", "RequestInit", "Headers", "Performance", "MediaQueryList", "console"] }
