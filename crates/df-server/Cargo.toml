[package]
name = "df-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[features]
# Development surfaces and environment-driven configuration; off in production images.
default = ["local-dev"]
local-dev = []

[lib]
name = "df_server"
path = "src/lib.rs"

[[bin]]
name = "df-server"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
df-session = { path = "../df-session" }
df-finance = { path = "../df-finance" }
df-persistence = { path = "../df-persistence" }
df-observe = { path = "../df-observe" }
serde = { version = "=1.0.229", features = ["derive"] }
tokio-postgres = { version = "=0.7.15", default-features = true }
toml = { version = "=0.9.12", default-features = false, features = ["std", "parse", "serde"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "io-util", "sync", "signal", "macros"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "=3.27.0"
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

