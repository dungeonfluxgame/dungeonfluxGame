[package]
name = "df-google"
description = "Direct server-side Google OIDC adapter and bounded local fakes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
test-fakes = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
df-customer = { path = "../df-customer" }
base64 = "=0.22.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "form"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
subtle = "=2.6.1"
tokio = { workspace = true, features = ["rt", "time", "net", "io-util", "sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

