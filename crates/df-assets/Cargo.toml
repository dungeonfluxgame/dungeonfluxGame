[package]
name = "df-assets"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
df-types = { path = "../df-types" }
df-observe = { path = "../df-observe" }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

[features]
# The in-memory object store and deterministic id source, for other crates' tests.
test-fakes = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
df-model = { path = "../df-model" }
tokio = { version = "=1.53.1", default-features = false, features = ["rt"] }
