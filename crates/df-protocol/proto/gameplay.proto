syntax = "proto3";
package dungeonflux.public.v1;
import "common.proto";
service ActionService { rpc Submit(SubmitActionRequest) returns (SubmitActionResponse); rpc PreviewHeroIdentity(PreviewHeroIdentityRequest) returns (PreviewHeroIdentityResponse); }
service SessionService { rpc Watch(WatchViewRequest) returns (stream ViewMessage); rpc ReportPresented(PresentedRequest) returns (PresentedResponse); }
// The shared display's presentation report: the last combat beat sequence it has finished
// presenting (CombatOutcome.sequence). Sequence only; the server accepts it solely from the
// room's display credential and lets it do nothing but advance the released sequence.
// display_instance distinguishes several displays sharing that credential (and one display
// across a page reload): the server keeps the newest report per instance and the slowest
// fresh instance governs, so a display that goes away stops governing when its report ages
// out. Zero is the legacy unknown instance.
message PresentedRequest { uint64 sequence = 1; uint64 display_instance = 2; string layout_readback_json = 3; }
message PresentedResponse { uint64 released_sequence = 1; }
enum GameplayActionKind { GAMEPLAY_ACTION_KIND_UNSPECIFIED = 0; EXAMINE_HARBOR_SEAL = 1; CHOOSE_HARBOR_SCENE = 2; CREATE_CHARACTER = 3; BEGIN_STORY = 4; ASK_COURIER = 5; ESCORT_COURIER = 6; DEFEND_COURIER = 7; GREATSWORD_ATTACK = 8; SECOND_WIND = 9; END_TURN = 10; SHORT_REST = 11; MOVE = 12; DASH = 13; DODGE = 14; DISENGAGE = 15; OPPORTUNITY_ATTACK = 16; DECLINE_REACTION = 17; STAND = 18; PICK_UP_WEAPON = 19; RESOLVE_ERRAND = 20; START_NEW_ADVENTURE = 21; STABILISE_WITH_HEALERS_KIT = 22; STABILISE_MEDICINE = 23; HELP_ATTACK = 24; SET_TABLE_SETTING = 40; SCENE_ASSAULT = 41; }
enum RejectionCode { REJECTION_CODE_UNSPECIFIED = 0; STALE_OFFER = 1; WRONG_TURN = 2; INVALID_SELECTION = 3; PAUSED = 4; RESOURCE_MISSING = 5; CAPABILITY_UNAVAILABLE = 6; RECOVERY_REQUIRED = 7; REVISION_CONFLICT = 8; OPERATION_CONFLICT = 9; OPERATION_EXPIRED = 10; }
message Rejection { RejectionCode code = 1; }
message AcceptedAction { AbilityCheckResult check = 1; GameplayScene scene = 2; CharacterSheet character = 3; repeated CombatOutcome combat = 4; JourneyPhase phase = 5; }
message SubmitActionRequest { SessionId session_id = 1; RunId run_id = 2; SessionRevision observed_revision = 3; OperationId operation_id = 4; string offer_id = 5; GameplayActionKind action_kind = 6; HarborDestination destination = 7; CharacterSelection character = 8; bool savage_attacker = 9; bool graze = 10; repeated JourneyChoice action_choices = 11; TableSettingChange table_setting = 12; }
// A room setting a seated player changes from the phone (SET_TABLE_SETTING). Exactly one value is set.
message TableSettingChange { oneof value { bool choice_hints_hidden = 1; } }
message AbilityCheckResult { uint32 die = 1; sint32 ability_modifier = 2; uint32 proficiency_bonus = 3; sint32 total = 4; uint32 difficulty_class = 5; bool succeeded = 6; string source_revision = 7; repeated uint32 faces = 8; sint32 roll_mode = 9; }
message DecisionReceipt { OperationId operation_id = 1; SessionRevision revision = 2; SessionId session_id = 3; RunId run_id = 4; bool replayed = 5; oneof outcome { AcceptedAction accepted = 6; Rejection rejected = 7; } }
message WatchViewRequest { SessionId session_id = 1; RunId run_id = 2; ClientBindingId client_binding_id = 3; SessionRevision after_revision = 4; }
message PlayerGameplayView { string offer_id = 1; string narration = 2; AbilityCheckResult check = 3; string private_clue = 4; bool action_available = 5; repeated GameplayActionOffer offers = 6; GameplayScene scene = 7; JourneyView journey = 8; }
message DisplayGameplayView { string narration = 1; string scene_asset = 2; GameplayScene scene = 3; JourneyView journey = 4; DisplaySceneGraph scene_graph = 5; uint64 live_plate_graph_revision = 6; AbilityCheckResult check = 7; optional uint32 encounter_xp = 8; string layout_json = 9; uint64 layout_revision = 10; PlaceMusicPlan place_music = 11; repeated string effects_off = 12; }
message ViewMessage { SessionRevision revision = 1; oneof audience { PlayerGameplayView player = 2; DisplayGameplayView display = 3; } }
message OperationObservation { RejectionCode code = 1; }
message SubmitActionResponse { oneof outcome { DecisionReceipt committed_decision = 1; OperationObservation operation_observation = 2; } }

enum HarborDestination { HARBOR_DESTINATION_UNSPECIFIED = 0; LOADING_PIER = 1; LANTERN_WHARF = 2; HARBOR_INN = 3; }
// live_backdrop (display only): a server-generated re-render of this scene's painting, `/gameplay/imagery/<key>`; empty when none. Presentation only.
// source_scene_key is the exact public pack::SceneKey label; empty means no authoritative source identity is available.
// source_scene_variant is the exact public BeatScript scene map key; empty identifies a compiled base scene.
message GameplayScene { HarborDestination destination = 1; string title = 2; string scene_asset = 3; string speaker_portrait = 4; repeated SceneActor cast = 5; string rules_note = 6; string place = 7; string location_id = 8; string live_backdrop = 9; string live_plate = 20; PlateLayout plate_layout = 21; PlateState plate_state = 22; HomeVideoState scene_video_state = 23; string scene_video_path = 24; string scene_contents_json = 25; SceneItemCard item = 26; bool plate_update_pending = 27; repeated SceneItemCard hand_items = 28; string source_scene_key = 29; string source_scene_variant = 30; bool interior = 31; StageFloor floor = 32; }
// Declared by the server from the place's setting (never guessed from art names): whether the scene is indoors, and where the floor, light and reflection of the place sit for the stage's figures. Absent floor means the default staging. Presentation only.
message StageFloor { uint32 feet_mid = 1; uint32 feet_far = 2; bool key_from_left = 3; bool wet = 4; }
// Audience-filtered object card. A failed picture keeps its detail available immediately.
message SceneItemCard {
  string thing_id = 1;
  string name = 2;
  string detail = 3;
  string image_path = 4;
  PlateState image_state = 5;
  uint64 state_revision = 6;
  // A taken scene thing is in the hero's hand for inspection, but is not owned inventory.
  bool observation_only = 7;
  string holder = 8;
  // Canonical custody IDs remain separate from the display names above.
  string owner_id = 9;
  string holder_id = 10;
  // Safe visual description used to rebuild the image request after reconnect.
  string picture_description = 11;
}
enum DisplaySceneCamera { DISPLAY_SCENE_CAMERA_UNSPECIFIED = 0; DISPLAY_SCENE_CAMERA_WIDE = 1; DISPLAY_SCENE_CAMERA_TWO_SHOT = 2; DISPLAY_SCENE_CAMERA_SPEAKER = 3; }
message DisplaySceneGraph { uint64 revision = 1; string scene_key = 2; DisplaySceneSet set = 3; DisplaySceneCamera camera = 4; repeated DisplaySceneActor actors = 5; }
message DisplaySceneSet { string place_id = 1; string place_name = 2; string asset = 3; string fallback_asset = 4; bool exterior = 5; string time_of_day = 6; string weather = 7; repeated string lights = 8; }
message DisplaySceneActor { string id = 1; string name = 2; string art = 3; string fallback_art = 4; string spot = 5; uint32 anchor_x_permille = 6; uint32 anchor_y_permille = 7; uint32 depth_permille = 8; string pose = 9; string expression = 10; optional string look_at = 11; bool speaking = 12; }
// PLAY-V09 scene plate (display and phones): one composed film still of the scene, `/gameplay/imagery/<key>`. `live_plate` is empty unless `plate_state` is READY; UNSPECIFIED means the scene has no plate (none planned, or imagery off), PENDING means one is being made, FAILED means none will come. UNAVAILABLE (PLAY-V12) means imagery is on but this story scene has no plate and will not get one (a creature speaks, or the scene has no place): the display holds the establishing picture and never draws cut-outs. The layout says where the speaker's head is in the plate and which side of it is kept calm for the speech bubble. Presentation only; a failed plate never changes the game.
enum PlateState { PLATE_STATE_UNSPECIFIED = 0; PLATE_STATE_PENDING = 1; PLATE_STATE_READY = 2; PLATE_STATE_FAILED = 3; PLATE_STATE_UNAVAILABLE = 4; }
enum PlateSide { PLATE_SIDE_UNSPECIFIED = 0; PLATE_SIDE_LEFT = 1; PLATE_SIDE_RIGHT = 2; }
// Positions are permille of the plate (0 to 1000 across and down); the head box is centred on the head position.
message PlateLayout { PlateSide bubble_side = 1; uint32 head_x_permille = 2; uint32 head_y_permille = 3; uint32 head_width_permille = 4; uint32 head_height_permille = 5; repeated PlateHead heroes = 6; repeated PlateActorHead actors = 7; }
// actor_id is the exact current SceneActor.id; the permille head box belongs to GameplayScene.live_plate.
message PlateActorHead { string actor_id = 1; PlateSide bubble_side = 2; uint32 head_x_permille = 3; uint32 head_y_permille = 4; uint32 head_width_permille = 5; uint32 head_height_permille = 6; }
// Where one hero's head is in the plate (the party member at `hero_index`, counted from 0) and which side of it a speech bubble stands on, toward the middle of the frame. Only heroes the vision model found are listed.
message PlateHead { uint32 hero_index = 1; PlateSide bubble_side = 2; uint32 head_x_permille = 3; uint32 head_y_permille = 4; uint32 head_width_permille = 5; uint32 head_height_permille = 6; }
enum SceneRole { SCENE_ROLE_UNSPECIFIED = 0; PATRON = 1; ANTAGONIST = 2; CONTACT = 3; BYSTANDER = 4; }
// live_sprite (display only): a server-generated expression variant of this character's cut-out, `/gameplay/imagery/<key>`; empty when none. Presentation only.
message SceneActor { string id = 1; string name = 2; SceneRole role = 3; string sprite = 4; string portrait = 5; bool speaking = 6; string live_sprite = 7; }
message HarborSceneOption { HarborDestination destination = 1; string label = 2; }
message GameplayActionOffer { string offer_id = 1; GameplayActionKind action_kind = 2; string label = 3; repeated HarborSceneOption destinations = 4; repeated JourneyGroup input_groups = 5; }

message CurrentAdventureRequest {}
message CurrentAdventureResponse { string room_code = 1; string run_identity = 2; bool preparing = 3; }
service RoomService { rpc CurrentAdventure(CurrentAdventureRequest) returns (CurrentAdventureResponse); rpc Join(JoinRoomRequest) returns (JoinRoomResponse); rpc Reclaim(ReclaimRoomRequest) returns (ReclaimRoomResponse); }
message JoinRoomRequest { string room_code = 1; OperationId operation_id = 2; bytes join_secret = 3; }
message JoinedRoom { DecisionReceipt receipt = 1; string local_binding = 2; ClientBindingId client_binding_id = 3; SessionId session_id = 4; RunId run_id = 5; }
message JoinRoomResponse { oneof outcome { JoinedRoom joined = 1; JoinRefusal refused = 2; } }
message JoinRefusal { RejectionCode code = 1; }
// SES-04: empty seat_token is a public away-seat read with the room code, with no operation.
// A nonempty token requires an operation id; exact retries retain both fields unchanged.
// Tokens are server-minted opaque capabilities, never member ids or prior credentials.
message ReclaimRoomRequest { string room_code = 1; OperationId operation_id = 2; bytes seat_token = 3; }
message AwayHero { string name = 1; bytes seat_token = 2; }
enum SeatReclaimRefusal { SEAT_RECLAIM_REFUSAL_UNSPECIFIED = 0; SEAT_NOT_AWAY = 1; SEAT_TOKEN_UNKNOWN = 2; SEAT_ROOM_CODE_WRONG = 3; SEAT_OPERATION_CONFLICT = 4; }
message ReclaimRoomResponse { oneof outcome { JoinedRoom joined = 1; SeatReclaimRefusal refused = 2; } repeated AwayHero away_heroes = 3; }
enum JourneyPhase { JOURNEY_PHASE_UNSPECIFIED = 0; ROOM = 1; CHARACTER_CREATION = 2; OPENING = 3; DIALOGUE = 4; COMBAT = 5; COMPLETE = 6; }
message JourneyChoice { string group_id = 1; string option_id = 2; }
message CharacterSelection { string name = 1; repeated JourneyChoice choices = 2; HeroIdentity identity = 3; }
message JourneyOption { string option_id = 1; string label = 2; string description = 3; string requires_group = 4; repeated string requires_options = 5; }
message JourneyGroup { string group_id = 1; string label = 2; repeated JourneyOption options = 3; }
// The 13 identity groups and default_identity are server-owned; their menu text carries narrative
// colour only and does not grant game mechanics.
message CharacterCreationOffer { string description = 1; repeated JourneyGroup groups = 2; string source_revision = 3; repeated JourneyGroup identity_groups = 4; HeroIdentity default_identity = 5; }
message CharacterSheet { string name = 1; repeated SheetFact facts = 2; uint32 hit_points = 3; uint32 maximum_hit_points = 4; uint32 armor_class = 5; string source_revision = 6; HeroIdentity identity = 7; repeated SceneItemCard owned_items = 8; }
message SheetFact { string label = 1; string value = 2; }
message PartyMemberView { string name = 1; bool character_ready = 2; uint32 hit_points = 3; uint32 maximum_hit_points = 4; bool active_turn = 5; bool unconscious = 6; bytes participant_id = 7; GridCell cell = 8; uint32 side = 9; repeated string conditions = 10; uint32 attack_style = 11; string voice_set = 12; string portrait = 13; string creature_id = 14; CreatureSize size = 15; }
// The SRD 5.2.1 stat block of a combatant, sent by the server so the display never infers either from art names. creature_id is the compiled SRD creature id ("wolf"); empty for a hero.
enum CreatureSize { CREATURE_SIZE_UNSPECIFIED = 0; SMALL = 1; MEDIUM = 2; LARGE = 3; }
// PLAY-R01: every outcome says what happened and proves it was legal. kind ATTACK or OPPORTUNITY_ATTACK carries
// distance_ft (grid distance in feet, 5 per square), attack_style (1 melee, 2 ranged), roll_mode (-1 Disadvantage, 0 normal,
// 1 Advantage), faces (every d20 rolled), reasons (labels of what gave Advantage or Disadvantage) and cover. kind MOVE carries
// path (the squares entered, in order), cost_ft (feet spent on them) and remaining_ft (movement left this turn). kind
// DEATH_SAVE carries attack_die (the d20), death_save_result and the running death_successes / death_failures. kind RECOVERY
// carries recovery_hours (a Stable hero regains 1 Hit Point after 1d4 hours).
enum OutcomeKind { OUTCOME_KIND_UNSPECIFIED = 0; OUTCOME_KIND_ATTACK = 1; OUTCOME_KIND_OPPORTUNITY_ATTACK = 2; OUTCOME_KIND_MOVE = 3; OUTCOME_KIND_DEATH_SAVE = 4; OUTCOME_KIND_RECOVERY = 5; OUTCOME_KIND_STABILISATION = 6; }
enum DeathSaveResult { DEATH_SAVE_RESULT_UNSPECIFIED = 0; DEATH_SAVE_RESULT_SUCCESS = 1; DEATH_SAVE_RESULT_FAILURE = 2; DEATH_SAVE_RESULT_CRITICAL_FAILURE = 3; DEATH_SAVE_RESULT_STABILISED = 4; DEATH_SAVE_RESULT_DIED = 5; DEATH_SAVE_RESULT_REVIVED = 6; }
enum StabilizationMethod { STABILIZATION_METHOD_UNSPECIFIED = 0; STABILIZATION_METHOD_HEALERS_KIT = 1; STABILIZATION_METHOD_MEDICINE = 2; }
// CombatView.outcomes holds only attacks (kind ATTACK or OPPORTUNITY_ATTACK, or UNSPECIFIED from before kinds existed);
// move_outcomes holds the MOVE outcomes and death_save_outcomes the DEATH_SAVE outcomes, each trimmed to the same recent window.
// Standing death-save state of a hero at 0 Hit Points (or just resolved), public to every seat: the table must see it.
message DeathSaveState { bytes participant_id = 1; string name = 2; uint32 successes = 3; uint32 failures = 4; bool stable = 5; bool dead = 6; }
// FIGHT-001: one spoken moment of a fight, staged with the blow it rides on: a battle cry or reaction
// (role HERO or NPC, with speaker and hero_index) or Dungeon Master narration (role NARRATOR, speaker
// empty). Authored on the server from content tables, deterministic for a given fight record; the
// browser only captions and voices it, never inventing one. Voice role and budget follow the existing
// narrator/NPC voice path by role.
message FightLine { TableRole role = 1; uint32 hero_index = 2; string speaker = 3; string text = 4; }
message CombatOutcome { string actor_name = 1; string target_name = 2; uint32 attack_die = 3; sint32 attack_modifier = 4; sint32 attack_total = 5; uint32 target_armor_class = 6; bool hit = 7; bool critical = 8; repeated uint32 damage_dice = 9; uint32 damage = 10; uint32 target_hit_points = 11; bool knocked_out = 12; bool grazed = 13; string source_revision = 14; bytes actor_id = 15; bytes target_id = 16; string weapon = 17; uint32 attack_style = 18; string damage_type = 19; uint32 distance_ft = 20; OutcomeKind kind = 21; repeated GridCell path = 22; uint32 cost_ft = 23; uint32 remaining_ft = 24; sint32 roll_mode = 25; repeated uint32 faces = 26; repeated string reasons = 27; string cover = 28; DeathSaveResult death_save_result = 29; uint32 death_successes = 30; uint32 death_failures = 31; uint32 recovery_hours = 32; repeated FightLine lines = 33; uint64 sequence = 34; StabilizationResult stabilization = 35; repeated DamageRoll damage_rolls = 36; sint32 damage_modifier = 37; }
message StabilizationResult { StabilizationMethod method = 1; uint32 die = 2; sint32 wisdom_modifier = 3; uint32 dc = 4; bool succeeded = 5; uint32 uses_left = 6; }
message CombatView { repeated PartyMemberView participants = 1; string active_actor = 2; uint32 round = 3; repeated CombatOutcome outcomes = 4; bool finished = 5; string source_revision = 6; bytes active_participant_id = 7; repeated InitiativeRoll initiative = 8; string layout_id = 9; repeated GridCell reachable_cells = 10; repeated LegalCombatTarget legal_targets = 11; TurnBudget own_budget = 12; CombatAmmunition own_ammunition = 13; bytes reaction_participant_id = 14; string location_id = 15; repeated DeathSaveState death_saves = 16; repeated CombatOutcome move_outcomes = 17; repeated CombatOutcome death_save_outcomes = 18; repeated FightLine closing_lines = 19; uint64 latest_sequence = 20; uint64 released_sequence = 21; uint32 reaction_seconds_remaining = 22; }
message InitiativeRoll { bytes participant_id = 1; string name = 2; uint32 die = 3; sint32 modifier = 4; sint32 total = 5; uint32 order = 6; }
// adventure_name (PLAY-V12, display and phones): the adventure's own title, on every view; the display's establishing shot names it with the place. Presentation only.
message JourneyView { JourneyPhase phase = 1; string room_code = 2; string join_path = 3; repeated PartyMemberView party = 4; CharacterCreationOffer creation = 5; CharacterSheet own_character = 6; CombatView combat = 7; string speaker = 8; string dialogue = 9; repeated TableLine table_log = 10; TempoCue tempo = 11; repeated string table_choices = 12; repeated NpcStanding standing = 13; repeated LiveFace live_faces = 14; uint64 presentation_sequence = 15; string reply_speaker = 16; repeated ComposingHero composing = 17; HomeTheme home = 30; HomeVideoState home_video_state = 31; string home_video_path = 32; string join_url = 45; bool adventure_ended = 50; bool preparing_adventure = 76; string adventure_title = 51; bool choice_hints_hidden = 70; string adventure_name = 75; repeated NotebookEntry notebook = 77; KillShot kill_shot = 78; }
// One killing blow's cosmetic clip (K1). Presentation only: it never changes an outcome or a
// timing. `state` reuses HomeVideoState (PENDING shows nothing, READY may play once, FAILED
// keeps the battlefield). `id` plus `epoch` are the one-shot identity: a replayed view with
// the same pair never plays again. `still_path` is the photographic still the clip was made
// from (`/gameplay/imagery/<key>`); `clip_path` is served only when READY.
message KillShot { string clip_path = 1; string still_path = 2; string killer = 3; string victim = 4; HomeVideoState state = 5; string id = 6; uint64 sequence = 7; uint64 epoch = 8; }
// A server-generated health variant of a hero's cut-out (`/gameplay/imagery/<key>`), by the party member's name; presentation only.
message LiveFace { string name = 1; string sprite = 2; string battle_sprite = 3; }
enum TableRole { TABLE_ROLE_UNSPECIFIED = 0; HERO = 1; NPC = 2; NARRATOR = 3; }
enum TableKind { TABLE_KIND_UNSPECIFIED = 0; ACTION = 1; SPEECH = 2; }
// Player view only: how a present NPC feels about this hero. attitude: 0 unknown, 1 hostile, 2 indifferent, 3 friendly (standard 2024 scale).
message NpcStanding { string npc_id = 1; string name = 2; uint32 attitude = 3; string perceived_reaction = 4; }
// What a d20 roll row carries for the shared display, so the table can show the die without reading its text. `faces` are the server's draws (two for advantage or disadvantage), `kept` is the face that counts, `modifier` is added to it for `total`, and `target_number` is the DC or AC named by `against` (unspecified when no number is known). `label` is the short name shown on the result card.
enum RollKind { ROLL_KIND_UNSPECIFIED = 0; ROLL_KIND_CHECK = 1; ROLL_KIND_SAVE = 2; ROLL_KIND_ATTACK = 3; ROLL_KIND_DEATH_SAVE = 4; ROLL_KIND_STABILIZE = 5; ROLL_KIND_INITIATIVE = 6; }
enum RollAgainst { ROLL_AGAINST_UNSPECIFIED = 0; ROLL_AGAINST_DC = 1; ROLL_AGAINST_AC = 2; }
message TableRoll { repeated uint32 faces = 1; uint32 kept = 2; sint32 roll_mode = 3; sint32 modifier = 4; sint32 total = 5; RollAgainst against = 6; uint32 target_number = 7; bool succeeded = 8; string label = 9; RollKind kind = 10; }
message TableLine { uint64 sequence = 1; string speaker = 2; TableRole role = 3; uint32 hero_index = 4; TableKind kind = 5; string text = 6; string actor_id = 7; TableRoll roll = 8; }

service DialogueService {
  rpc Submit(RawDialogueRequest) returns (DialogueResponse);
  rpc Confirm(ConfirmDialogueRequest) returns (SubmitActionResponse);
  rpc Cancel(CancelDialogueRequest) returns (DialogueResponse);
  // Ephemeral speech intent (typing or talking). Presentation only: never committed, never a revision.
  rpc Compose(ComposeRequest) returns (ComposeResponse);
}
enum DialogueContext { DIALOGUE_CONTEXT_UNSPECIFIED = 0; DIALOGUE_CONTEXT_QUESTION = 1; DIALOGUE_CONTEXT_SOCIAL = 2; DIALOGUE_CONTEXT_PLAN_ONLY = 3; DIALOGUE_CONTEXT_META = 4; DIALOGUE_CONTEXT_JOKE = 5; DIALOGUE_CONTEXT_CLARIFY = 6; }
enum DialogueFinality { DIALOGUE_FINALITY_UNSPECIFIED = 0; DIALOGUE_FINALITY_PARTIAL = 1; DIALOGUE_FINALITY_FINAL = 2; }
enum DialogueDisposition { DIALOGUE_DISPOSITION_UNSPECIFIED = 0; DIALOGUE_DISPOSITION_ACTION = 1; DIALOGUE_DISPOSITION_QUESTION = 2; DIALOGUE_DISPOSITION_SOCIAL = 3; DIALOGUE_DISPOSITION_PLAN_ONLY = 4; DIALOGUE_DISPOSITION_META = 5; DIALOGUE_DISPOSITION_JOKE = 6; DIALOGUE_DISPOSITION_CLARIFY = 7; DIALOGUE_DISPOSITION_REJECTED = 8; }
message RawDialogueRequest { SessionId session_id = 1; RunId run_id = 2; SessionRevision observed_revision = 3; OperationId input_id = 4; string text = 5; DialogueContext context = 6; DialogueFinality finality = 7; string offer_id = 8; }
message ConfirmDialogueRequest { OperationId input_id = 1; bytes confirmation_token = 2; SubmitActionRequest action = 3; }
message CancelDialogueRequest { OperationId input_id = 1; bytes confirmation_token = 2; }
// What a player is doing in the dialogue box, so the table sees that a hero is about to speak. The words and audio never
// leave the phone before submit. STOPPED clears the mark; a mark not refreshed within a few seconds expires on the server.
enum ComposeKind { COMPOSE_KIND_UNSPECIFIED = 0; COMPOSE_KIND_TYPING = 1; COMPOSE_KIND_SPEAKING = 2; COMPOSE_KIND_SUBMITTED = 3; COMPOSE_KIND_STOPPED = 4; }
message ComposeRequest { ComposeKind kind = 1; }
message ComposeResponse {}
message ComposingHero { uint32 hero_index = 1; ComposeKind kind = 2; }
message DialogueResponse { OperationId input_id = 1; DialogueDisposition disposition = 2; bytes confirmation_token = 3; SessionRevision revision = 4; bool confirmation_required = 5; string npc_reply = 6; string npc_actor_id = 7; string npc_speaker = 8; }

// Public presentation only. Sequence is monotonic within the native owner lifetime; reset on authenticated watch reconnect.
enum TempoPhase { TEMPO_PHASE_UNSPECIFIED = 0; TEMPO_PHASE_CALM = 1; TEMPO_PHASE_BUILD = 2; TEMPO_PHASE_ANTICIPATION = 3; TEMPO_PHASE_PEAK = 4; TEMPO_PHASE_RELEASE = 5; }
message TempoCue { uint32 intensity_permille = 1; TempoPhase phase = 2; uint64 sequence = 3; uint32 hold_millis = 4; }

// The place's own score, decided by the server and shown on the display only. FALLBACK plays the
// shared score (plus the chosen ambience bed, if any); READY names the place's generated layers in
// track order bed, motif, tension, combat. bpm, loop_samples and sample_rate say the layers share
// the shared score's timebase; a client that cannot match it keeps the fallback.
enum PlaceMusicState { PLACE_MUSIC_STATE_UNSPECIFIED = 0; PLACE_MUSIC_STATE_FALLBACK = 1; PLACE_MUSIC_STATE_READY = 2; }
message PlaceMusicPlan { string spec_label = 1; string setting_family = 2; PlaceMusicState state = 3; string spec_key = 4; repeated string layer_paths = 5; string ambience_path = 6; string fallback_note = 7; uint32 bpm = 8; uint32 loop_samples = 9; uint32 sample_rate = 10; }

// Tactical public presentation: side 1 heroes/2 enemies, attack_style 1 melee/2 ranged.
// Resource details below are projected only to their owning player; never to display.
message GridCell { uint32 col = 1; uint32 row = 2; }
message TurnBudget { uint32 movement_ft = 1; bool action = 2; bool bonus_action = 3; bool reaction = 4; }
message CombatAmmunition { uint32 arrows = 1; uint32 bolts = 2; }
message LegalCombatTarget { bytes participant_id = 1; string weapon = 2; string cover = 3; string range_reason = 4; bool disadvantage = 5; repeated string reasons = 6; string option_id = 7; }
// Home screen (lobby) presentation, decided by the server from validated theme data and carried
// on JourneyView.home (field 30). Presentation only: the layout is fixed in the browser (PLAY-V11).
// The painting's mood: colours as #rrggbb, vignette and grade as permille (1000 is unchanged).
message HomeMood { string accent = 1; string tint = 2; uint32 vignette_permille = 3; uint32 brightness_permille = 4; uint32 contrast_permille = 5; uint32 saturation_permille = 6; }
// fallback: no theme record exists for this painting, so the neutral mood applies. Fields 2 to 5 were
// the arrangement name and the title, code and party boxes (retired by PLAY-V11, so reserved).
message HomeTheme { reserved 2 to 5; reserved "arrangement", "title", "code", "party"; string location_id = 1; HomeMood mood = 6; repeated string atmosphere = 7; bool fallback = 8; }
// PLAY-V10: the home screen loop, for the display only. The path is served only when the state is READY.
enum HomeVideoState { HOME_VIDEO_STATE_UNSPECIFIED = 0; HOME_VIDEO_STATE_NONE = 1; HOME_VIDEO_STATE_PENDING = 2; HOME_VIDEO_STATE_READY = 3; HOME_VIDEO_STATE_FAILED = 4; }

// The server's audience-filtered campaign notebook. Owner appears only for an unshared clue.
enum NotebookKind { NOTEBOOK_KIND_UNSPECIFIED = 0; NOTEBOOK_KIND_PERSON = 1; NOTEBOOK_KIND_PLACE = 2; NOTEBOOK_KIND_TASK = 3; NOTEBOOK_KIND_CLUE = 4; NOTEBOOK_KIND_NOTE = 5; }
message NotebookEntry { NotebookKind kind = 1; string title = 2; string text = 3; string scene = 4; uint64 order = 5; optional string owner = 6; optional string author = 7; optional string attitude = 8; }

// RUL-04: one complete damage roll; `kept` names the rule-authoritative chosen roll.
message DamageRoll { repeated uint32 dice = 1; bool kept = 2; }

// Closed-menu appearance IDs are each bounded to 32 UTF-8 bytes. Narrative text is bounded and
// descriptive only; it never grants a rule, feature, proficiency, item, statistic, or entitlement.
message HeroAppearance { string presentation = 1; string pronouns = 2; string age = 3; string build = 4; string skin = 5; string hair = 6; string hair_color = 7; string eyes = 8; string mark = 9; string attire = 10; }
// Optional on CharacterSelection and CharacterSheet so an absent legacy choice remains distinct
// from a new hero's explicitly selected identity. origin, occupation and motivation are each
// bounded to 160 Unicode characters; backstory is bounded to 480; facts contain 3 to 6 entries,
// each bounded to 160; the encoded identity is bounded to 8 KiB.
message HeroIdentity { HeroAppearance appearance = 1; string origin = 2; string occupation = 3; string motivation = 4; string backstory = 5; repeated string facts = 6; }
// Preview is authenticated to a joined seat, read-only, deadline/cancellation bounded, and must
// recheck observed_revision before returning. appearance_text is bounded to 1000 Unicode
// characters and backstory_text to 4000; source is "models" or "local-menu-matches".
message PreviewHeroIdentityRequest { SessionId session_id = 1; RunId run_id = 2; SessionRevision observed_revision = 3; string appearance_text = 4; string backstory_text = 5; HeroIdentity current_identity = 6; ClientBindingId client_binding_id = 7; }
message PreviewHeroIdentityResponse { HeroIdentity proposed_identity = 1; repeated string warnings = 2; string source = 3; }

// Bounded diagnostic upload; never advances gameplay or presentation authority.
service PresentationTelemetryService { rpc Upload(PresentationTelemetryRequest) returns (PresentationTelemetryResponse); }
message PresentationTelemetryRequest { WatchViewRequest scope = 1; bytes producer_id = 2; uint64 batch_sequence = 3; bytes otlp_logs = 4; uint64 dropped_records = 5; }
message PresentationTelemetryResponse { uint64 batch_sequence = 1; uint32 accepted_records = 2; bool replayed = 3; }
