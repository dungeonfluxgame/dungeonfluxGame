syntax = "proto3";
package dungeonflux.public.v1;
import "common.proto";
service ActionService { rpc Submit(SubmitActionRequest) returns (SubmitActionResponse); }
service SessionService { rpc Watch(WatchViewRequest) returns (stream ViewMessage); rpc ReportPresented(PresentedRequest) returns (PresentedResponse); }
// The shared display's presentation report: the last combat beat sequence it has finished
// presenting (CombatOutcome.sequence). Sequence only; the server accepts it solely from the
// room's display credential and lets it do nothing but advance the released sequence.
message PresentedRequest { uint64 sequence = 1; }
message PresentedResponse { uint64 released_sequence = 1; }
enum GameplayActionKind { GAMEPLAY_ACTION_KIND_UNSPECIFIED = 0; EXAMINE_HARBOR_SEAL = 1; CHOOSE_HARBOR_SCENE = 2; CREATE_CHARACTER = 3; BEGIN_STORY = 4; ASK_COURIER = 5; ESCORT_COURIER = 6; DEFEND_COURIER = 7; GREATSWORD_ATTACK = 8; SECOND_WIND = 9; END_TURN = 10; SHORT_REST = 11; MOVE = 12; DASH = 13; DODGE = 14; DISENGAGE = 15; OPPORTUNITY_ATTACK = 16; DECLINE_REACTION = 17; STAND = 18; PICK_UP_WEAPON = 19; RESOLVE_ERRAND = 20; SET_TABLE_SETTING = 40; }
enum RejectionCode { REJECTION_CODE_UNSPECIFIED = 0; STALE_OFFER = 1; WRONG_TURN = 2; INVALID_SELECTION = 3; PAUSED = 4; RESOURCE_MISSING = 5; CAPABILITY_UNAVAILABLE = 6; RECOVERY_REQUIRED = 7; REVISION_CONFLICT = 8; OPERATION_CONFLICT = 9; OPERATION_EXPIRED = 10; }
message Rejection { RejectionCode code = 1; }
message AcceptedAction { AbilityCheckResult check = 1; GameplayScene scene = 2; CharacterSheet character = 3; repeated CombatOutcome combat = 4; JourneyPhase phase = 5; }
message SubmitActionRequest { SessionId session_id = 1; RunId run_id = 2; SessionRevision observed_revision = 3; OperationId operation_id = 4; string offer_id = 5; GameplayActionKind action_kind = 6; HarborDestination destination = 7; CharacterSelection character = 8; bool savage_attacker = 9; bool graze = 10; repeated JourneyChoice action_choices = 11; TableSettingChange table_setting = 12; }
// A room setting a seated player changes from the phone (SET_TABLE_SETTING). Exactly one value is set.
message TableSettingChange { oneof value { bool choice_hints_hidden = 1; } }
message AbilityCheckResult { uint32 die = 1; sint32 ability_modifier = 2; uint32 proficiency_bonus = 3; sint32 total = 4; uint32 difficulty_class = 5; bool succeeded = 6; string source_revision = 7; }
message DecisionReceipt { OperationId operation_id = 1; SessionRevision revision = 2; SessionId session_id = 3; RunId run_id = 4; bool replayed = 5; oneof outcome { AcceptedAction accepted = 6; Rejection rejected = 7; } }
message WatchViewRequest { SessionId session_id = 1; RunId run_id = 2; ClientBindingId client_binding_id = 3; SessionRevision after_revision = 4; }
message PlayerGameplayView { string offer_id = 1; string narration = 2; AbilityCheckResult check = 3; string private_clue = 4; bool action_available = 5; repeated GameplayActionOffer offers = 6; GameplayScene scene = 7; JourneyView journey = 8; }
message DisplayGameplayView { string narration = 1; string scene_asset = 2; GameplayScene scene = 3; JourneyView journey = 4; }
message ViewMessage { SessionRevision revision = 1; oneof audience { PlayerGameplayView player = 2; DisplayGameplayView display = 3; } }
message OperationObservation { RejectionCode code = 1; }
message SubmitActionResponse { oneof outcome { DecisionReceipt committed_decision = 1; OperationObservation operation_observation = 2; } }

enum HarborDestination { HARBOR_DESTINATION_UNSPECIFIED = 0; LOADING_PIER = 1; LANTERN_WHARF = 2; HARBOR_INN = 3; }
// live_backdrop (display only): a server-generated re-render of this scene's painting, `/gameplay/imagery/<key>`; empty when none. Presentation only.
message GameplayScene { HarborDestination destination = 1; string title = 2; string scene_asset = 3; string speaker_portrait = 4; repeated SceneActor cast = 5; string rules_note = 6; string place = 7; string location_id = 8; string live_backdrop = 9; string live_plate = 20; PlateLayout plate_layout = 21; PlateState plate_state = 22; }
// PLAY-V09 scene plate (display and phones): one composed film still of the scene, `/gameplay/imagery/<key>`. `live_plate` is empty unless `plate_state` is READY; UNSPECIFIED means the scene has no plate (none planned, or imagery off), PENDING means one is being made, FAILED means none will come. UNAVAILABLE (PLAY-V12) means imagery is on but this story scene has no plate and will not get one (a creature speaks, or the scene has no place): the display holds the establishing picture and never draws cut-outs. The layout says where the speaker's head is in the plate and which side of it is kept calm for the speech bubble. Presentation only; a failed plate never changes the game.
enum PlateState { PLATE_STATE_UNSPECIFIED = 0; PLATE_STATE_PENDING = 1; PLATE_STATE_READY = 2; PLATE_STATE_FAILED = 3; PLATE_STATE_UNAVAILABLE = 4; }
enum PlateSide { PLATE_SIDE_UNSPECIFIED = 0; PLATE_SIDE_LEFT = 1; PLATE_SIDE_RIGHT = 2; }
// Positions are permille of the plate (0 to 1000 across and down); the head box is centred on the head position.
message PlateLayout { PlateSide bubble_side = 1; uint32 head_x_permille = 2; uint32 head_y_permille = 3; uint32 head_width_permille = 4; uint32 head_height_permille = 5; repeated PlateHead heroes = 6; }
// Where one hero's head is in the plate (the party member at `hero_index`, counted from 0) and which side of it a speech bubble stands on, toward the middle of the frame. Only heroes the vision model found are listed.
message PlateHead { uint32 hero_index = 1; PlateSide bubble_side = 2; uint32 head_x_permille = 3; uint32 head_y_permille = 4; uint32 head_width_permille = 5; uint32 head_height_permille = 6; }
enum SceneRole { SCENE_ROLE_UNSPECIFIED = 0; PATRON = 1; ANTAGONIST = 2; CONTACT = 3; BYSTANDER = 4; }
// live_sprite (display only): a server-generated expression variant of this character's cut-out, `/gameplay/imagery/<key>`; empty when none. Presentation only.
message SceneActor { string id = 1; string name = 2; SceneRole role = 3; string sprite = 4; string portrait = 5; bool speaking = 6; string live_sprite = 7; }
message HarborSceneOption { HarborDestination destination = 1; string label = 2; }
message GameplayActionOffer { string offer_id = 1; GameplayActionKind action_kind = 2; string label = 3; repeated HarborSceneOption destinations = 4; repeated JourneyGroup input_groups = 5; }

service RoomService { rpc Join(JoinRoomRequest) returns (JoinRoomResponse); }
message JoinRoomRequest { string room_code = 1; OperationId operation_id = 2; bytes join_secret = 3; }
message JoinedRoom { DecisionReceipt receipt = 1; string local_binding = 2; ClientBindingId client_binding_id = 3; SessionId session_id = 4; RunId run_id = 5; }
message JoinRoomResponse { oneof outcome { JoinedRoom joined = 1; JoinRefusal refused = 2; } }
message JoinRefusal { RejectionCode code = 1; }
enum JourneyPhase { JOURNEY_PHASE_UNSPECIFIED = 0; ROOM = 1; CHARACTER_CREATION = 2; OPENING = 3; DIALOGUE = 4; COMBAT = 5; COMPLETE = 6; }
message JourneyChoice { string group_id = 1; string option_id = 2; }
message CharacterSelection { string name = 1; repeated JourneyChoice choices = 2; }
message JourneyOption { string option_id = 1; string label = 2; string description = 3; string requires_group = 4; repeated string requires_options = 5; }
message JourneyGroup { string group_id = 1; string label = 2; repeated JourneyOption options = 3; }
message CharacterCreationOffer { string description = 1; repeated JourneyGroup groups = 2; string source_revision = 3; }
message CharacterSheet { string name = 1; repeated SheetFact facts = 2; uint32 hit_points = 3; uint32 maximum_hit_points = 4; uint32 armor_class = 5; string source_revision = 6; }
message SheetFact { string label = 1; string value = 2; }
message PartyMemberView { string name = 1; bool character_ready = 2; uint32 hit_points = 3; uint32 maximum_hit_points = 4; bool active_turn = 5; bool unconscious = 6; bytes participant_id = 7; GridCell cell = 8; uint32 side = 9; repeated string conditions = 10; uint32 attack_style = 11; string voice_set = 12; string portrait = 13; }
// PLAY-R01: every outcome says what happened and proves it was legal. kind ATTACK or OPPORTUNITY_ATTACK carries
// distance_ft (grid distance in feet, 5 per square), attack_style (1 melee, 2 ranged), roll_mode (-1 Disadvantage, 0 normal,
// 1 Advantage), faces (every d20 rolled), reasons (labels of what gave Advantage or Disadvantage) and cover. kind MOVE carries
// path (the squares entered, in order), cost_ft (feet spent on them) and remaining_ft (movement left this turn). kind
// DEATH_SAVE carries attack_die (the d20), death_save_result and the running death_successes / death_failures. kind RECOVERY
// carries recovery_hours (a Stable hero regains 1 Hit Point after 1d4 hours).
enum OutcomeKind { OUTCOME_KIND_UNSPECIFIED = 0; OUTCOME_KIND_ATTACK = 1; OUTCOME_KIND_OPPORTUNITY_ATTACK = 2; OUTCOME_KIND_MOVE = 3; OUTCOME_KIND_DEATH_SAVE = 4; OUTCOME_KIND_RECOVERY = 5; }
enum DeathSaveResult { DEATH_SAVE_RESULT_UNSPECIFIED = 0; DEATH_SAVE_RESULT_SUCCESS = 1; DEATH_SAVE_RESULT_FAILURE = 2; DEATH_SAVE_RESULT_CRITICAL_FAILURE = 3; DEATH_SAVE_RESULT_STABILISED = 4; DEATH_SAVE_RESULT_DIED = 5; DEATH_SAVE_RESULT_REVIVED = 6; }
// CombatView.outcomes holds only attacks (kind ATTACK or OPPORTUNITY_ATTACK, or UNSPECIFIED from before kinds existed);
// move_outcomes holds the MOVE outcomes and death_save_outcomes the DEATH_SAVE outcomes, each trimmed to the same recent window.
// Standing death-save state of a hero at 0 Hit Points (or just resolved), public to every seat: the table must see it.
message DeathSaveState { bytes participant_id = 1; string name = 2; uint32 successes = 3; uint32 failures = 4; bool stable = 5; bool dead = 6; }
// FIGHT-001: one spoken moment of a fight, staged with the blow it rides on: a battle cry or reaction
// (role HERO or NPC, with speaker and hero_index) or Dungeon Master narration (role NARRATOR, speaker
// empty). Authored on the server from content tables, deterministic for a given fight record; the
// browser only captions and voices it, never inventing one. Voice role and budget follow the existing
// narrator/NPC voice path by role.
message FightLine { TableRole role = 1; uint32 hero_index = 2; string speaker = 3; string text = 4; }
message CombatOutcome { string actor_name = 1; string target_name = 2; uint32 attack_die = 3; sint32 attack_modifier = 4; sint32 attack_total = 5; uint32 target_armor_class = 6; bool hit = 7; bool critical = 8; repeated uint32 damage_dice = 9; uint32 damage = 10; uint32 target_hit_points = 11; bool knocked_out = 12; bool grazed = 13; string source_revision = 14; bytes actor_id = 15; bytes target_id = 16; string weapon = 17; uint32 attack_style = 18; string damage_type = 19; uint32 distance_ft = 20; OutcomeKind kind = 21; repeated GridCell path = 22; uint32 cost_ft = 23; uint32 remaining_ft = 24; sint32 roll_mode = 25; repeated uint32 faces = 26; repeated string reasons = 27; string cover = 28; DeathSaveResult death_save_result = 29; uint32 death_successes = 30; uint32 death_failures = 31; uint32 recovery_hours = 32; repeated FightLine lines = 33; uint64 sequence = 34; }
message CombatView { repeated PartyMemberView participants = 1; string active_actor = 2; uint32 round = 3; repeated CombatOutcome outcomes = 4; bool finished = 5; string source_revision = 6; bytes active_participant_id = 7; repeated InitiativeRoll initiative = 8; string layout_id = 9; repeated GridCell reachable_cells = 10; repeated LegalCombatTarget legal_targets = 11; TurnBudget own_budget = 12; CombatAmmunition own_ammunition = 13; bytes reaction_participant_id = 14; string location_id = 15; repeated DeathSaveState death_saves = 16; repeated CombatOutcome move_outcomes = 17; repeated CombatOutcome death_save_outcomes = 18; repeated FightLine closing_lines = 19; uint64 latest_sequence = 20; uint64 released_sequence = 21; }
message InitiativeRoll { bytes participant_id = 1; string name = 2; uint32 die = 3; sint32 modifier = 4; sint32 total = 5; uint32 order = 6; }
// adventure_name (PLAY-V12, display and phones): the adventure's own title, on every view; the display's establishing shot names it with the place. Presentation only.
message JourneyView { JourneyPhase phase = 1; string room_code = 2; string join_path = 3; repeated PartyMemberView party = 4; CharacterCreationOffer creation = 5; CharacterSheet own_character = 6; CombatView combat = 7; string speaker = 8; string dialogue = 9; repeated TableLine table_log = 10; TempoCue tempo = 11; repeated string table_choices = 12; repeated NpcStanding standing = 13; repeated LiveFace live_faces = 14; uint64 presentation_sequence = 15; string reply_speaker = 16; repeated ComposingHero composing = 17; HomeTheme home = 30; HomeVideoState home_video_state = 31; string home_video_path = 32; string join_url = 45; bool adventure_ended = 50; string adventure_title = 51; bool choice_hints_hidden = 70; string adventure_name = 75; }
// A server-generated health variant of a hero's cut-out (`/gameplay/imagery/<key>`), by the party member's name; presentation only.
message LiveFace { string name = 1; string sprite = 2; string battle_sprite = 3; }
enum TableRole { TABLE_ROLE_UNSPECIFIED = 0; HERO = 1; NPC = 2; NARRATOR = 3; }
enum TableKind { TABLE_KIND_UNSPECIFIED = 0; ACTION = 1; SPEECH = 2; }
// Player view only: how a present NPC feels about this hero. attitude: 0 unknown, 1 hostile, 2 indifferent, 3 friendly (standard 2024 scale).
message NpcStanding { string npc_id = 1; string name = 2; uint32 attitude = 3; }
message TableLine { uint64 sequence = 1; string speaker = 2; TableRole role = 3; uint32 hero_index = 4; TableKind kind = 5; string text = 6; }

service DialogueService {
  rpc Submit(RawDialogueRequest) returns (DialogueResponse);
  rpc Confirm(ConfirmDialogueRequest) returns (SubmitActionResponse);
  rpc Cancel(CancelDialogueRequest) returns (DialogueResponse);
  // Ephemeral speech intent (typing or talking). Presentation only: never committed, never a revision.
  rpc Compose(ComposeRequest) returns (ComposeResponse);
}
enum DialogueContext { DIALOGUE_CONTEXT_UNSPECIFIED = 0; DIALOGUE_CONTEXT_QUESTION = 1; DIALOGUE_CONTEXT_SOCIAL = 2; DIALOGUE_CONTEXT_PLAN_ONLY = 3; DIALOGUE_CONTEXT_META = 4; DIALOGUE_CONTEXT_JOKE = 5; DIALOGUE_CONTEXT_CLARIFY = 6; }
enum DialogueFinality { DIALOGUE_FINALITY_UNSPECIFIED = 0; DIALOGUE_FINALITY_PARTIAL = 1; DIALOGUE_FINALITY_FINAL = 2; }
enum DialogueDisposition { DIALOGUE_DISPOSITION_UNSPECIFIED = 0; DIALOGUE_DISPOSITION_ACTION = 1; DIALOGUE_DISPOSITION_QUESTION = 2; DIALOGUE_DISPOSITION_SOCIAL = 3; DIALOGUE_DISPOSITION_PLAN_ONLY = 4; DIALOGUE_DISPOSITION_META = 5; DIALOGUE_DISPOSITION_JOKE = 6; DIALOGUE_DISPOSITION_CLARIFY = 7; DIALOGUE_DISPOSITION_REJECTED = 8; }
message RawDialogueRequest { SessionId session_id = 1; RunId run_id = 2; SessionRevision observed_revision = 3; OperationId input_id = 4; string text = 5; DialogueContext context = 6; DialogueFinality finality = 7; string offer_id = 8; }
message ConfirmDialogueRequest { OperationId input_id = 1; bytes confirmation_token = 2; SubmitActionRequest action = 3; }
message CancelDialogueRequest { OperationId input_id = 1; bytes confirmation_token = 2; }
// What a player is doing in the dialogue box, so the table sees that a hero is about to speak. The words and audio never
// leave the phone before submit. STOPPED clears the mark; a mark not refreshed within a few seconds expires on the server.
enum ComposeKind { COMPOSE_KIND_UNSPECIFIED = 0; COMPOSE_KIND_TYPING = 1; COMPOSE_KIND_SPEAKING = 2; COMPOSE_KIND_SUBMITTED = 3; COMPOSE_KIND_STOPPED = 4; }
message ComposeRequest { ComposeKind kind = 1; }
message ComposeResponse {}
message ComposingHero { uint32 hero_index = 1; ComposeKind kind = 2; }
message DialogueResponse { OperationId input_id = 1; DialogueDisposition disposition = 2; bytes confirmation_token = 3; SessionRevision revision = 4; bool confirmation_required = 5; string npc_reply = 6; }

// Public presentation only. Sequence is monotonic within the native owner lifetime; reset on authenticated watch reconnect.
enum TempoPhase { TEMPO_PHASE_UNSPECIFIED = 0; TEMPO_PHASE_CALM = 1; TEMPO_PHASE_BUILD = 2; TEMPO_PHASE_ANTICIPATION = 3; TEMPO_PHASE_PEAK = 4; TEMPO_PHASE_RELEASE = 5; }
message TempoCue { uint32 intensity_permille = 1; TempoPhase phase = 2; uint64 sequence = 3; uint32 hold_millis = 4; }

// Tactical public presentation: side 1 heroes/2 enemies, attack_style 1 melee/2 ranged.
// Resource details below are projected only to their owning player; never to display.
message GridCell { uint32 col = 1; uint32 row = 2; }
message TurnBudget { uint32 movement_ft = 1; bool action = 2; bool bonus_action = 3; bool reaction = 4; }
message CombatAmmunition { uint32 arrows = 1; uint32 bolts = 2; }
message LegalCombatTarget { bytes participant_id = 1; string weapon = 2; string cover = 3; string range_reason = 4; bool disadvantage = 5; repeated string reasons = 6; string option_id = 7; }
// Home screen (lobby) presentation, decided by the server from validated theme data and carried
// on JourneyView.home (field 30). Presentation only: the layout is fixed in the browser (PLAY-V11).
// The painting's mood: colours as #rrggbb, vignette and grade as permille (1000 is unchanged).
message HomeMood { string accent = 1; string tint = 2; uint32 vignette_permille = 3; uint32 brightness_permille = 4; uint32 contrast_permille = 5; uint32 saturation_permille = 6; }
// fallback: no theme record exists for this painting, so the neutral mood applies. Fields 2 to 5 were
// the arrangement name and the title, code and party boxes (retired by PLAY-V11, so reserved).
message HomeTheme { reserved 2 to 5; reserved "arrangement", "title", "code", "party"; string location_id = 1; HomeMood mood = 6; repeated string atmosphere = 7; bool fallback = 8; }
// PLAY-V10: the home screen loop, for the display only. The path is served only when the state is READY.
enum HomeVideoState { HOME_VIDEO_STATE_UNSPECIFIED = 0; HOME_VIDEO_STATE_NONE = 1; HOME_VIDEO_STATE_PENDING = 2; HOME_VIDEO_STATE_READY = 3; HOME_VIDEO_STATE_FAILED = 4; }
